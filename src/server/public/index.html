// ---------------------------------------------------------------- people
function peopleIndex(list) {
  const map = new Map();
  for (const l of list) {
    const k = personKey(l);
    if (!map.has(k)) map.set(k, { key: k, leaves: [] });
    map.get(k).leaves.push(l);
  }
  for (const p of map.values()) {
    p.leaves.sort((a, b) => (b.start || '').localeCompare(a.start || ''));
    const latest = p.leaves.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    p.latest = latest[0];
    p.name = (latest.find((l) => l.avatar) || latest[0]).name;
    p.avatar = latest.find((l) => l.avatar)?.avatar || null;
    const emp = latest.find((l) => l.employee)?.employee;
    const live = emp && Object.values(emp.balance).some((v) => v != null);
    const snap = latest.find((l) => l.balance.vacation != null || l.balance.sick != null);
    p.balanceLive = !!live;
    p.balance = live ? emp.balance : snap?.balance || null;
    p.balanceAt = live ? emp.balanceUpdated : snap?.createdAt || null;
  }
  return map;
}
function personStats(p, year) {
  const a = `${year}-01-01`, b = `${year}-12-31`;
  const appr = p.leaves.filter((l) => l.approval === 'Approved');
  const byType = Object.fromEntries(TYPES.map((t) => [t, sum(appr.filter((l) => l.type === t), (l) => daysInRange(l, a, b))]));
  const total = sum(TYPES, (t) => byType[t]);
  const unpaid = sum(appr.filter((l) => l.start && l.start.startsWith(String(year))), (l) => l.unpaid);
  const t = today();
  const current = appr.find((l) => overlaps(l, t, t));
  const next = p.leaves.filter((l) => (l.approval === 'Approved' || l.approval === 'Pending') && l.start > t).sort((x, y) => x.start.localeCompare(y.start))[0];
  const pending = p.leaves.filter((l) => l.approval === 'Pending').length;
  return { byType, total, unpaid, current, next, pending, count: p.leaves.filter((l) => overlaps(l, a, b)).length };
}
const balLabel = (p) => p.balanceLive
  ? `Leave balance${p.balanceAt ? ' · updated ' + esc(fmtDate(p.balanceAt.slice(0, 10), { wd: false })) : ''}${info('pBalanceLive')}`
  : `Balance on last request · ${esc(fmtDate(p.balanceAt.slice(0, 10), { wd: false }))}${info('pBalance')}`;
const balBox = (bal) => `<div class="balances">${[['Vacation', 'vacation'], ['Sick', 'sick'], ['Emergency', 'emergency']].map(([lab, k]) => `<div><b>${bal && bal[k] != null ? fmtNum(bal[k]) : '—'}</b>${lab}</div>`).join('')}</div>`;

function renderPeople() {
  const el = $('#v-people');
  const s = state.ppl;
  const idx = peopleIndex(scoped());
  const years = [...new Set(state.leaves.map((l) => l.start?.slice(0, 4)).filter(Boolean))].sort().reverse();
  const q = s.q.trim().toLowerCase();
  let list = [...idx.values()].map((p) => ({ p, st: personStats(p, s.year) }))
    .filter(({ p, st }) => (q ? `${p.name} ${p.key} ${p.latest.dept}`.toLowerCase().includes(q) : st.count > 0 || st.pending || st.next));
  const sorters = {
    days: (a, b) => b.st.total - a.st.total,
    unpaid: (a, b) => b.st.unpaid - a.st.unpaid || b.st.total - a.st.total,
    name: (a, b) => a.p.name.localeCompare(b.p.name),
    next: (a, b) => (a.st.current ? '0' : a.st.next?.start || '9').localeCompare(b.st.current ? '0' : b.st.next?.start || '9'),
  };
  list.sort((a, b) => sorters[s.sort](a, b) || a.p.name.localeCompare(b.p.name));
  const t = today();

  el.innerHTML = `
    <div class="toolbar">
      <input class="search" id="pq" placeholder="Search people…" value="${esc(s.q)}">
      <select class="sel" id="pYear">${years.map((y) => `<option ${+y === s.year ? 'selected' : ''}>${y}</option>`).join('')}</select>
      <select class="sel" id="pSort">${[['days', 'Most days off'], ['unpaid', 'Most unpaid days'], ['next', 'Next leave'], ['name', 'Name']].map(([k, lab]) => `<option value="${k}" ${s.sort === k ? 'selected' : ''}>Sort: ${lab}</option>`).join('')}</select>
      <span class="summary"><b>${list.length}</b> people${q ? '' : ` with leave in ${s.year}`}${state.hiddenFormer ? ` · former employees hidden${info('former')}` : ''}</span>
    </div>
    <div class="pgrid">${list.map(({ p, st }) => `
      <div class="card pcard" data-person="${esc(p.key)}">
        <div class="top">${avatar({ name: p.name, avatar: p.avatar })}<div class="pmain"><div class="pname">${esc(p.name)}</div><div class="pmeta">${esc(p.latest.dept || p.latest.deptGroup)}${p.latest.manager ? ' · ' + esc(p.latest.manager) : ''}</div></div>
          ${st.pending ? `<span class="st" style="--c:var(--warn)" data-tip="${esc(`<div class=\"tx\">${G.pPending}</div>`)}">◷ ${st.pending} pending</span>` : ''}</div>
        <div><div style="display:flex;align-items:baseline;gap:8px"><span class="big">${fmtNum(Math.round(st.total * 10) / 10)}</span><span class="muted" style="font-size:12.5px">days off in ${s.year}${info('pDays')}</span>${st.unpaid ? `<span class="spacer"></span><span style="font-size:12.5px;color:var(--warn);font-weight:600">${fmtNum(st.unpaid)} unpaid${info('pUnpaid')}</span>` : ''}</div>
          <div class="stackbar" style="margin:8px 0">${st.total ? TYPES.filter((ty) => st.byType[ty]).map((ty) => `<i style="--c:${typeColor(ty)};width:${(st.byType[ty] / st.total) * 100}%"></i>`).join('') : ''}</div>
          <div class="kv">${TYPES.filter((ty) => st.byType[ty]).map((ty) => `<span><span class="type" style="--c:${typeColor(ty)}">${typeShort(ty)}</span> <b>${fmtNum(Math.round(st.byType[ty] * 10) / 10)}</b></span>`).join('') || '<span>No approved leave</span>'}</div></div>
        ${p.balance ? `<div><div class="faint" style="font-size:11.5px;margin-bottom:5px">${balLabel(p)}</div>${balBox(p.balance)}</div>` : ''}
        <div class="next">${info('pNext')}${st.current ? `<span class="st" style="--c:${typeColor(st.current.type)}">On leave</span> until ${esc(fmtDate(st.current.end || st.current.start))}` : st.next ? `<span class="faint">Next</span> ${typePill(st.next.type)} <span>${esc(fmtRange(st.next))}</span>${st.next.approval === 'Pending' ? '<span class="faint">(pending)</span>' : ''}` : '<span class="faint">No upcoming leave</span>'}</div>
      </div>`).join('') || '<div class="empty">Nobody found</div>'}</div>`;
  $('#pq').oninput = (e) => { s.q = e.target.value; renderPeople(); const i = $('#pq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  $('#pYear').onchange = (e) => { s.year = +e.target.value; renderPeople(); };
  $('#pSort').onchange = (e) => { s.sort = e.target.value; renderPeople(); };
}

      ${row('Email', esc(l.email || '—'))}
      ${row('Department', esc(l.dept || '—'))}
      ${row('Manager', esc(l.manager || '—') + (l.managerEmail ? ` <span class="faint">${esc(l.managerEmail)}</span>` : ''))}
      ${row('Lead', esc(l.leads.join(', ') || '—'), 'lead')}
      ${row('Days requested', esc(fmtNum(l.days)), 'days')}
      ${row('Paid days', esc(fmtNum(l.deducted)), 'paid')}
      ${row('Unpaid days', l.unpaid ? `<b style="color:var(--warn)">${fmtNum(l.unpaid)}</b>` : '0', 'unpaid')}
      ${row('Balances on request', `Vacation <b>${fmtNum(l.balance.vacation)}</b> · Sick <b>${fmtNum(l.balance.sick)}</b> · Emergency <b>${fmtNum(l.balance.emergency)}</b>`, 'balances')}
      ${row('For finance', finPill(l.finance), 'finance')}
      ${row('Payroll stage', stagePill(stageOf(l)), 'finStage')}
      ${row('Filed', esc(new Date(l.createdAt).toLocaleString()), 'filed')}
      ${row('Last edited', esc(new Date(l.editedAt).toLocaleString()))}
    </dl>
    <div style="display:flex;gap:8px;margin-top:22px"><a class="btn primary" href="${esc(l.url)}" target="_blank" rel="noopener">Open in Notion ↗</a><button class="btn" data-person="${esc(personKey(l))}">All leave for ${esc(l.name.split(' ')[0])}</button></div>`);
}

function showPerson(key) {
  const p = peopleIndex(state.leaves).get(key); if (!p) return;
  const year = new Date().getFullYear();
  const st = personStats(p, year), stPrev = personStats(p, year - 1);
  const byYear = new Map();
  for (const l of p.leaves) { const y = l.start?.slice(0, 4) || 'No date'; if (!byYear.has(y)) byYear.set(y, []); byYear.get(y).push(l); }
  const statBlock = (y, s) => `<div class="card" style="padding:12px 14px"><div class="faint" style="font-size:11.5px">${y}</div><div style="font-size:20px;font-weight:700" class="num">${fmtNum(Math.round(s.total * 10) / 10)} <span class="muted" style="font-size:12px;font-weight:500">days</span></div>
    <div class="kv" style="margin-top:4px">${TYPES.filter((t) => s.byType[t]).map((t) => `<span>${typeShort(t)} <b>${fmtNum(Math.round(s.byType[t] * 10) / 10)}</b></span>`).join('') || '<span>—</span>'}${s.unpaid ? `<span style="color:var(--warn)">Unpaid <b style="color:var(--warn)">${fmtNum(s.unpaid)}</b></span>` : ''}</div></div>`;
  openDrawer(`<div style="display:flex;gap:12px;align-items:center">${avatar({ name: p.name, avatar: p.avatar }, 'lg')}<div style="min-width:0"><h2>${esc(p.name)}</h2><div class="pmeta">${esc(p.latest.dept || p.latest.deptGroup)}${p.latest.manager ? ' · Manager: ' + esc(p.latest.manager) : ''}</div><div class="pmeta">${esc(p.latest.email || '')}</div></div></div>`, `
    ${p.balance ? `<div class="faint" style="font-size:12px;margin-bottom:6px">${balLabel(p)}</div>${balBox(p.balance)}` : ''}
    <div class="grid g2" style="margin-top:14px">${statBlock(year, st)}${statBlock(year - 1, stPrev)}</div>
    <div class="hist" style="margin-top:8px">${[...byYear].map(([y, ls]) => `<div class="yr">${y} · ${ls.length} REQUEST${ls.length === 1 ? '' : 'S'}</div>` + ls.map((l) => `
      <div class="h" data-leave="${l.id}"><div><div class="hd">${esc(fmtRange(l, { year: false }))}</div><div class="hm">${typePill(l.type)}<span>${esc(daysLabel(l.days))}</span>${l.unpaid ? `<span style="color:var(--warn)">${fmtNum(l.unpaid)} unpaid</span>` : ''}${l.note ? `<span class="faint" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px">${esc(l.note)}</span>` : ''}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">${statusPill(l.approval)}${finPill(l.finance)}</div></div>`).join('')).join('')}</div>`);
}

// Capture phase, so tapping an ⓘ never also sorts a column, opens a row or switches tab.
document.addEventListener('click', (e) => {
  const inf = e.target.closest?.('.info');
  if (inf) { e.preventDefault(); e.stopPropagation(); showTipAt(inf); return; }
  if (!e.target.closest?.('[data-tip]')) hideTip();
}, true);
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go) { if (go.dataset.go === 'finance') Object.assign(state.fin, { stage: 'process', q: '', limit: 100 }); setTab(go.dataset.go); return; }
  if (e.target.closest('a[href^="http"], select, input, .btn.primary')) return;
  const lv = e.target.closest('[data-leave]'); if (lv) { e.preventDefault(); hideTip(); showLeave(lv.dataset.leave); return; }
  const pp = e.target.closest('[data-person]'); if (pp) { e.preventDefault(); showPerson(pp.dataset.person); }
});

// ---------------------------------------------------------------- data
function renderTab() {
  if (!state.leaves.length) return;
  ({ overview: renderOverview, approvals: renderApprovals, calendar: renderCalendar, requests: renderRequests, finance: renderFinance, people: renderPeople })[state.tab]();
}
function renderAll() { renderDeptFilters(); renderBadges(); renderTab(); }

async function load() {
  const res = await fetch('/api/leaves');
  if (!res.ok) throw new Error(res.status === 503 ? 'The server is still loading from Notion…' : `HTTP ${res.status}`);
  const data = await res.json();
  state.leaves = data.leaves; state.version = data.version; state.fetchedAt = res.headers.get('X-Fetched-At');
  state.hiddenFormer = data.hiddenFormer || 0;
  G.former = `<p><b>${state.hiddenFormer}</b> requests from people who no longer work here (Employment Status <b>Resigned</b> or <b>Fired</b> in Team Members) are hidden everywhere: in lists, totals, charts and CSV exports.</p><p>People who can't be found in Team Members are still shown.</p>`;
  $('#syncInfo').innerHTML = info('sync');
  $('#loading').hidden = true;
  // Keep the search box focus when a background update re-renders the table
  const focused = document.activeElement?.id;
  renderAll();
  if (focused && $('#' + focused)) { const i = $('#' + focused); i.focus(); if (i.setSelectionRange && i.value) i.setSelectionRange(i.value.length, i.value.length); }
  updateAgo();
}
function updateAgo() {
  $('#ago').textContent = state.fetchedAt ? `Synced ${ago(state.fetchedAt)}` : 'Loading…';
}
async function poll() {
  try {
    const s = await (await fetch('/api/status')).json();
    state.fetchedAt = s.fetchedAt;
    $('#sync').classList.toggle('err', !!s.lastError);
    $('#errBanner').hidden = !s.lastError;
    if (s.lastError) $('#errBanner').textContent = `Couldn't reach Notion on the last sync (${s.lastError}). Showing the last good data.`;
    if (s.version !== state.version) await load();
  } catch { $('#sync').classList.add('err'); }
  updateAgo();
}
$('#refresh').onclick = async () => {
  const b = $('#refresh'); b.disabled = true; b.textContent = '↻ Syncing…';
  try {
    const r = await fetch('/api/refresh', { method: 'POST' });
    if (!r.ok) { const j = await r.json().catch(() => ({})); b.textContent = j.error || 'Failed'; setTimeout(() => { b.textContent = '↻ Refresh'; b.disabled = false; }, 2500); return; }
    await poll();
  } finally { if (b.textContent === '↻ Syncing…') { b.textContent = '↻ Refresh'; b.disabled = false; } }
};
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (state.tab === 'overview' && state.leaves.length) drawMonthChart(approved(scoped())); }, 150); });

(async function boot() {
  const initial = location.hash.slice(1);
  setTab($('#v-' + initial) ? initial : 'overview');
  for (let i = 0; ; i++) {
    try { await load(); break; } catch (err) { $('#loading').textContent = err.message; await new Promise((r) => setTimeout(r, 3000)); }
  }
  setInterval(poll, 30_000);
  setInterval(() => { updateAgo(); }, 30_000);
})();
</script>
</body>
